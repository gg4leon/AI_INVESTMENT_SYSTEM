name: AIS quality checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q main.py streamlit_app.py analysis data backtesting app automation nory tests
      - name: Offline unit, integration and Streamlit tests
        run: python -m unittest discover -s tests -v
      - name: CLI demo smoke test
        run: python main.py --demo --mode all --symbols SPY
      - name: Legacy paper worker paused-safe smoke test
        run: python -m automation.worker --demo --once --symbols SPY
      - name: Nory worker paused-safe smoke test
        run: python -m nory.worker --demo --once --symbols SPY AAPL MSFT BTC-USD
      - name: MicroLab synthetic-second worker smoke test
        run: python -m nory.micro_worker --demo --steps 1 --interval-seconds 0.1 --symbols SPY AAPL NVDA

      - name: Kraken public connectivity probe (optional live network)
        continue-on-error: true
        run: python -m nory.kraken_probe --seconds 20 --symbols BTC-USD ETH-USD
