name: AIS quality checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q main.py analysis data backtesting tests
      - name: Offline unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Offline CLI smoke test (synthetic only)
        run: python main.py --demo --mode all --symbols SPY
